# Limitar memoria de Gradle a 1GB
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
# Desactivar compilación paralela
org.gradle.parallel=false
# Solo 1 tarea a la vez
org.gradle.workers.max=1
# Memoria para Kotlin
kotlin.daemon.jvm.options=-Xmx512M
# AndroidX (necesario para tu proyecto)
android.useAndroidX=true